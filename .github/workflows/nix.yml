name: Nix
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NIXPKGS_ALLOW_UNFREE: 1
jobs:
  check:
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.os.system }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.os.system }}-
          save: false
      - run: nix flake check --impure
  # When nixpkgs or another input is updated that can change the output hash of a package that the devShells depend on
  # we want to be able to test to know that they eval and can actually build a usable shell
  devShell:
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
        devShell:
          - base
          - default
          - git-hooks
          - discipline-default
          - framework-default
          - language-default
          - backend
          - frontend
          - devops
          - angular
          - ansible
          - csharp
          - golang
          - nodejs
          - terraform
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.os.system }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.os.system }}-
          save: ${{ matrix.devShell == 'default' }}
      - run: nix develop --impure '.#${{ matrix.devShell }}' --command true
  services:
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
        stack:
          - default
          - database
          - telemetry
          - lgtp
          - openobserve
          - storage
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.os.system }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.os.system }}-
          save: false
      - run: nix build --impure -L '.#checks.${{ matrix.os.system }}.${{ matrix.stack }}'
